name: Touchline Studio Auto Reels

on:
  schedule:
    - cron: '0 8,16 * * *' # Har kuni 2 mahal avtomatik ishlaydi
  workflow_dispatch: # Qo'lda yoqib ko'rish tugmasi

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Touchline Studio Agent
        env:
          LIVE_MODE: "false"
        run: |
          python main.py
concurrency: 
